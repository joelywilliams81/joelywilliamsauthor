<dialog id="reader" aria-labelledby="r-title"><div class="dlg-in"><button class="close" id="r-close" type="button">Close</button><span class="note" id="r-tag"></span><h3 id="r-title"></h3><div class="poem-body" id="r-body"></div></div></dialog></main>

<footer><div class="wrap"><span class="note">poems never die</span>Joely Williams · Poet and letter maker · Columbia, South Carolina<br><a href="https://instagram.com/poems_neverdie" target="_blank" rel="noopener">@poems_neverdie</a></div></footer><script>const POEMS=[{tag:'Poetry',title:'My Best Friend',excerpt:'I had a dream with Ruliette / She was walking across the street...',body:`I had a dream with Ruliette
She was walking across the street
in a world where everything already didn't make sense.

You used to be so quiet
barely looking at me sometimes-
afraid of something I could never locate.

Someone made you speak out loud.
Pressured you into audible squeaks
(you couldn't fool me, you were still a mouse).

I used to sneak over to your house
when Mami finally said I could walk to school alone.
We'd put on make-up before the first bell.
Mami never let me walk alone again.

I called out for you in this made-up world:
Rulie!
and there you were, walking fast,
in a hurry toward something I couldn't see.

I woke up reaching for my phone.`},{tag:'Poetry',title:'A Birth in The Bronx',excerpt:'The hard part is over now / She is in your arms...',body:`The hard part is over now.
She is in your arms.

This you cannot commodify.
This you cannot package into brown boxes
and ship anywhere.

A watchful eye will do much in this world-
for bumped heads, knees, shoulders, toes,
for the sad eyes that look like your own,
for the angry face you'll recognize
because you made it once in a bathroom mirror
and didn't know what it meant yet.

A hand to jot it all down.
A tired eye that learns to rest
when she rests.

Getting used to it is like tying a shoe-
you'll forget you're doing it.
The car seat's in.
Everyone is ready.

She already knows your hands.`},{tag:'Poetry',title:'Cold-Blooded',excerpt:'We are baby North American painted turtles. / We are a clutch...',body:`We are baby North American painted turtles.
We are a clutch.
We hatched into the chill of what had already begun.

Nothing to eat. Nothing to do.
We cannot clamber out of the hole
so we stay where we are.

It is winter. Negative ten.
Ice crystals forming around us
and inside us,
in the spaces between what we're made of.

Here is the thing about our skin:
what is killing everything else
is what keeps us.

The cold is the condition.
We learned this early.
We are still learning it.

Our deep-frozen state is the waiting.
We are very good at waiting.
We have had to be.

Spring will come-
we know this not because we are hopeful
but because we carry the cellular memory
of springs that came before we existed.

The body knows what the mind is still arguing about.

The ice melts from around us first.
Then from within us. Slowly.
Carry whatever it carries.

This is not a metaphor for recovery.`},{tag:'Poetry',title:'What the Scaffolding Carries',excerpt:'I dragged my arm along the green building / the way you drag a hand through water...',body:`I dragged my arm along the green building
the way you drag a hand through water
to feel the resistance of a thing that will not move for you.

A year's worth of the city came off on my skin:
scaffold-soot, rain-residue,
the accumulated breath of everyone
who had passed and touched and left
their particular grime on the green.

I didn't wipe it off.

This is what the neighborhood does if you let it-
marks you. Leaves its year on your arm.
Lets you carry it south,
lets you carry it wherever you go,
invisible now but present,
the way all the places you have ever lived
are present in the body
as a particular kind of knowledge
the skin holds without being asked.

The scaffolding is gone now.
Something new is going up
where the green building was.
It does not know my arm.
It has not earned my grime.

I am still, in the bones of me, on the fourth floor.
I am still watching the light come through
at the angle it came through
when I was someone who lived there.`},{tag:'Poetry',title:'my phone knows when i am lonely',excerpt:'Around 11:40 p.m. / my phone starts suggesting sad songs / before I know I am sad...',body:`Around 11:40 p.m.
my phone starts suggesting sad songs
before I know I am sad.

Just the kind of sad where I stand in the kitchen too long
with the refrigerator open
letting cold air collect on my legs
like I paid for it.

The algorithm has learned
my particular silences.
It knows when I start searching:

how to sleep
why do I feel weird lately
bronx apartments 2004
pictures of old bodegas
does grief make your body heavier
how long does nostalgia last

It starts feeding me women
speaking softly about healing.
Men making coffee in dark apartments.
Clips of oceans.
People explaining loneliness
under blue lighting.

This little rectangle
has watched me survive more nights
than most people know about.

I fall asleep holding it
like somebody's hand.

In the morning
there are fingerprints across the screen
and a notification asking
how I slept.

I almost answer honestly.`},{tag:'Poetry',title:'bronx dream with disappearing supermarkets',excerpt:'The supermarket only exists in my dreams now. / C-Town. Or Associated...',body:`The supermarket only exists in my dreams now.
C-Town.
Or Associated.
Or Western Beef.
One of those stores where the freezers
and the customers were one
and somebody's auntie was always yelling
from aisle seven.

In the dream
I am twelve again
under fluorescent lights,
fabuloso and something past its date
in the back of my throat,
holding Goya packets against my chest
while my mother compares prices
and makes decisions I never heard out loud.

Every time I turn the corner
the aisles rearrange themselves.
The bread becomes shampoo.
The rice becomes batteries.
The milk disappears entirely.

A man stocking shelves
looks exactly like my dead cousin
but older.
Nobody mentions this.

Somewhere near frozen foods
Marc Anthony is playing too loudly.
The floor is wet.
There are no warning signs.

I keep trying to reach the checkout line
but the store keeps expanding-
a whole extra produce section,
then another aisle,
then another room
filled with things we used to buy
before the rent went up.

Outside the windows
the Bronx keeps changing decades.

1998
1999
2000

A luxury gym replaces the botanica
mid-conversation.

When I finally find my mother
she is younger than me.
She touches my face.

mija, levantate before they change it again.

I wake with grocery store cold
still in my hands.`},{tag:'Poetry',title:'voice memo left unsent',excerpt:'hey- / I almost called you tonight / but it felt unfair...',body:`hey-

I almost called you tonight
but it felt unfair
to hand somebody this much heaviness
on a Wednesday.

The laundromat near my apartment
closed early again.
The cashier at the gas station
called me baby
like he knew me from somewhere.

I think everybody is lonely right now
in ways we don't have language for yet-

not lonely like isolation,
lonely like having too many tabs open,
lonely like watching people become advertisements for themselves,
lonely like missing versions of a city
that technically still exist.

Earlier today
I saw a little girl in Target
singing to herself in Spanish
while her mother priced detergent
with a calculator.
I almost started crying in seasonal decor.

Anyway.

The sky here still looks wrong to me.
Too open.
Too much room for your thoughts to spread out.
Back home the buildings interrupted you.
The trains interrupted you.
Somebody fighting outside interrupted you.
You didn't have to sit inside yourself this long.

It's late.
I probably won't send this.
But it felt good
to hear somebody breathing
even if it was only me.`}];


(function(){
  var list=document.getElementById('poem-list'); if(!list)return;
  POEMS.forEach(function(p){
    var li=document.createElement('li'), b=document.createElement('button'); b.type='button';
    var h=document.createElement('h3'); h.textContent=p.title;
    var ex=document.createElement('p'); ex.className='ex'; ex.innerHTML=p.excerpt.replace(/ \/ /g,'<br>');
    var go=document.createElement('span'); go.className='go'; go.textContent='Read the poem';
    b.appendChild(h); b.appendChild(ex); b.appendChild(go);
    b.addEventListener('click',function(){
      document.getElementById('r-tag').textContent=p.tag; document.getElementById('r-title').textContent=p.title; document.getElementById('r-body').textContent=p.body;
      var d=document.getElementById('reader'); if(d.showModal)d.showModal(); else d.setAttribute('open','');
    });
    li.appendChild(b); list.appendChild(li);
  });
  var dlg=document.getElementById('reader');
  document.getElementById('r-close').addEventListener('click',function(){dlg.close();});
  dlg.addEventListener('click',function(e){if(e.target===dlg)dlg.close();});
})();</script>
